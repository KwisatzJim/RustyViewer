[package]
name = "rusty_viewer"
version = "0.2.1"
edition = "2024"
description = "A local-first image viewer and editor built with Rust and Tauri"
license = "MIT"
repository = "https://github.com/KwisatzJim/RustyViewer"
homepage = "https://github.com/KwisatzJim/RustyViewer"
keywords = ["image-viewer", "image-editor", "tauri", "desktop"]
categories = ["multimedia::images", "gui"]
publish = false

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "ico"] }
arboard = { version = "3.4.1", features = ["wayland-data-control"] }
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
dirs = "6.0"
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
serde_json = "1"
