name: Feature request
description: Suggest a focused improvement to RustyViewer
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: workflow
    attributes:
      label: What workflow would this improve?
      description: Describe what you are trying to accomplish and where the current workflow gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how you would expect the feature to work.
    validations:
      required: true

